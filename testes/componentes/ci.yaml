name: Diagrameria CI - Lint e Testes

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # -----------------------------
  # 1. Verificação Backend
  # ------------------------------
  validar-backend:
    runs-on: ubuntu-latest
    
    # remover # para indicar subpasta onde contém o arquivo a ser verificado.
    # defaults:
    #   run:
    #     working-directory: ./backend

    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Versão LTS atual do Node.js
          cache: 'npm'

      - name: Instalar dependências do Backend
        run: npm ci # 'npm ci' é mais seguro e rápido para pipelines do que 'npm install'

      - name: Executar Linters (Backend)
        run: npm run lint

      - name: Executar Testes Unitários (Jest - Validador UML e Pontuação)
        run: npm test

  # ---------------------------------
  # 2. Verificação Frontend
  # ---------------------------------
  validar-frontend:
    runs-on: ubuntu-latest
    
    # remover # para indicar subpasta onde contém o arquivo a ser verificado.
    # defaults:
    #   run:
    #     working-directory: ./frontend

    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências do Frontend
        run: npm ci

      - name: Executar Linters (Frontend)
        run: npm run lint

      - name: Executar Testes Unitários (Frontend)
        run: npm test