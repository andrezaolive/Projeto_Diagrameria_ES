name: Diagrameria CI - Lint e Testes

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

# Um push novo na mesma branch cancela a execucao anterior, que ja nao interessa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-qualidade:
    name: Backend - lint e formatacao
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # npm ci em vez de npm install: instala exatamente o package-lock.json e
      # falha se ele estiver desatualizado em relacao ao package.json.
      - name: Instalar dependências
        run: npm ci

      - name: Executar Linter
        run: npm run lint

      - name: Conferir formatacao
        # --check em vez de --write: a CI aponta o arquivo torto, quem corrige e
        # a pessoa, rodando `npm run formatar` localmente.
        run: npx prettier --check .

  backend-testes:
    name: Backend - testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    # Mesma imagem do backend/docker-compose.yml. Nao da para reusar o compose
    # aqui: o job precisa do Postgres como service para o healthcheck segurar os
    # testes ate o banco aceitar conexao.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: diagrameria
          POSTGRES_PASSWORD: diagrameria
          POSTGRES_DB: diagrameria
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U diagrameria"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORTA: 5432
      DB_USUARIO: diagrameria
      DB_SENHA: diagrameria
      DB_NOME: diagrameria
      DB_NOME_TESTE: diagrameria_teste
      # Segredo de brinquedo, valido so dentro do runner: nenhum token assinado
      # aqui sai deste job. O segredo de producao vem de GitHub Secrets.
      JWT_SEGREDO: segredo-de-ci-nao-usar-em-producao
      JWT_EXPIRACAO: 1h

    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      # O db/init/ do compose nao roda aqui (services nao montam volume), entao
      # o banco de teste e criado na mao.
      - name: Criar o banco de testes
        run: |
          PGPASSWORD=diagrameria psql -h localhost -U diagrameria -d diagrameria \
            -c 'CREATE DATABASE diagrameria_teste OWNER diagrameria'

      - name: Aplicar migrations
        run: npm run migrate

      - name: Executar Testes
        run: npm test

  validar-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install

      - name: Executar Linter
        run: npm run lint

      - name: Executar Testes
        run: npm test
