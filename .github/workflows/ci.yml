name: Diagrameria CI - Setup Inicial

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  preparacao:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v4

      - name: Validar Estrutura
        run: |
          echo "Estrutura inicial de pastas criada com sucesso"
          echo "Os testes em Jest e o Validador UML serão ativados nesta pipeline assim que o código começar a ser enviado."
