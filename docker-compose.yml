services:
  postgres:
    image: postgres:16-alpine
    container_name: diagrameria-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: diagrameria
      POSTGRES_PASSWORD: diagrameria
      POSTGRES_DB: diagrameria
    ports:
      - "5432:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql/data
      # Cria o banco de testes junto com o de desenvolvimento, na primeira subida.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diagrameria -d diagrameria"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dados_postgres:
